 for(let i=0;i<secs.length;i++){toast(`Redistribuindo as folgas… setor ${i+1} de ${secs.length} (${secs[i].name}). Aguarde.`);await nap();
  try{const r=rebalance([secs[i]],mode,reopen);tot.ch+=r.changed;tot.ed=tot.ed&&tot.ed<r.ed?tot.ed:r.ed}
  catch(e){console.error(e);try{restoreSnap(secs[i])}catch(_){}tot.fail.push(secs[i].name+' ('+e.message+')')}}
 if(tot.ed)log(`Redistribuiu as folgas (${secs.map(x=>x.name).join(', ')}) a partir de ${fmt(tot.ed)}`);render();
 toast(tot.fail.length?'Não foi possível redistribuir: '+tot.fail.join('; ')+'. Esse setor ficou como estava.':tot.ch?'Folgas redistribuídas. Se não gostar, use "↩ Desfazer".':lockedM(secs).length&&!reopen?'Nada mudou porque os meses estão FINALIZADOS. Repita e marque "Reabrir esses meses".':'Nada precisou mudar: as folgas já estão na melhor distribuição possível.')}

function undoOne(op){let n=0;(op.ch||[]).forEach(([ym,key,old])=>{const sc=sector.scales[ym];if(sc&&!sc.finished){sc.ov[key]=old;n++}});if(op.cell){const sc=sector.scales[op.cell[0]];if(sc&&!sc.finished){sc.cells[op.cell[1]]=op.cell[2];n++}}return n}

function undoAll(){const n=undoN();if(!n)return toast('Não há nada para desfazer.');if(!confirm('Desfazer TODAS as '+n+' alterações manuais feitas nesta sessão (folgas clicadas, turnos pintados e células editadas) neste setor?'))return;for(let i=paintHist.length-1;i>=0;i--)if(paintHist[i].sid===sector.id)undoOne(paintHist.splice(i,1)[0]);log('Desfez todas as alterações manuais da sessão ('+sector.name+')');save();render();toast('Tudo desfeito: a escala voltou como estava ao abrir.')}
function clearPaint(){const[y,m]=sm(),s=sector,sc=scaleOf(s,y,m);if(sc.finished)return toast('Mês finalizado.');const ch=[];Object.keys(sc.ov).forEach(k=>{if(k.startsWith('S|')&&sc.ov[k]!=='-'){ch.push([y+'-'+pad(m+1),k,sc.ov[k]]);sc.ov[k]='-'}});if(!ch.length)return toast('Não há turnos pintados neste mês.');paintHist.push({sid:s.id,ch});save();render();toast('Turnos do mês limpos. Use “Desfazer” se foi sem querer.')}
const brushPanel=()=>!brush.on?'':`<div class="legend" style="gap:8px;align-items:center;flex-wrap:wrap"><b>🎨 Definir turnos:</b>${[...Object.keys(SH),'A'].map(k=>`<button class="${brush.k===k?'primary':'secondary'}" style="${k!=='A'?`background:${SH[k][1]};color:#111;border:2px solid ${brush.k===k?'#000':SH[k][2]}`:''}" onclick="brush.k='${k}';render()">${k==='A'?'Automático':SH[k][0]}</button>`).join('')}<select onchange="brush.sc=this.value;render()"><option value="d" ${brush.sc==='d'?'selected':''}>Só o dia clicado</option><option value="7" ${brush.sc==='7'?'selected':''}>7 dias a partir do dia clicado</option><option value="w" ${brush.sc==='w'?'selected':''}>A semana toda (seg–dom)</option><option value="m" ${brush.sc==='m'?'selected':''}>Do dia clicado até o fim do mês</option></select><button class="secondary" onclick="clearPaint()">Limpar turnos do mês</button><span class="hint" style="flex-basis:100%">Escolha o turno e clique no dia de uma pessoa. Clique na <b>faixa colorida da equipe</b> para aplicar à equipe inteira. “Automático” volta ao turno normal da equipe.</span></div>`;
function paintSh(id,d,team){const[y,m]=sm(),s=sector,sc0=scaleOf(s,y,m);if(sc0.finished)return toast('Mês finalizado: clique em “Editar” para alterar os turnos.');
 const ppl=team?(s.employees||[]).filter(f=>f.team===id):(s.employees||[]).filter(f=>f.id===id);if(!ppl.length)return;
 const st=new Date(y,m,d,12);let a=st,n=1;if(brush.sc==='7')n=7;else if(brush.sc==='w'){a=addD(st,-((st.getDay()+6)%7));n=7}else if(brush.sc==='m')n=new Date(y,m+1,0).getDate()-d+1;
 const ch=[];for(let i=0;i<n;i++){const dt=addD(a,i),sc=scaleOf(s,dt.getFullYear(),dt.getMonth());if(sc.finished)continue;ppl.forEach(f=>{const key='S|'+f.id+'_'+dt.getDate(),nv=brush.k==='A'?'-':'s'+brush.k;if((sc.ov[key]||'-')!==nv){ch.push([dt.getFullYear()+'-'+pad(dt.getMonth()+1),key,sc.ov[key]||'-']);sc.ov[key]=nv}})}
 if(!ch.length)return toast('Nada mudou.');paintHist.push({sid:s.id,ch});if(paintHist.length>500)paintHist.shift();

function tog(id,d){const[y,m]=sm(),sc=scaleOf(sector,y,m),f=sector.employees.find(x=>x.id===id),dt=new Date(y,m,d,12),k=id+'_'+d,nat=nat5(sector,f,dt),cur=isOff(f,sector,dt);if(!cur&&(isOff(f,sector,addD(dt,-1))||isOff(f,sector,addD(dt,1))))return toast('Não é permitido folga em dias seguidos (sem pares).');paintHist.push({sid:sector.id,ch:[[y+'-'+pad(m+1),k,sc.ov[k]||'N']]});if(cur===nat)sc.ov[k]=nat?'W':'F';else sc.ov[k]='N';save();log(`Ajustou folga de ${f.name} (dia ${d}) em ${sector.name}`);render()}

function vUsers(){const us=db.users;return topb('Usuários e senhas','<button class="secondary" onclick="pwModal()">Minha senha</button><button class="primary" onclick="userModal()">+ Novo usuário</button>')+'<div class="page"><p class="sub">Para o usuário entrar, use o nome (ex.: <b>unidadeb</b>) ou um e-mail.</p><div class="panel">'+us.map(u=>`<div class="row"><div><b>${esc(u.user)}</b>${u.id===me.id?' (você)':''}<small>${u.role==='central'?'Login central (todas as unidades)':'Unidade: '+esc(db.units.find(x=>x.id===u.unitId)?.name||'—')}</small></div><div><button class="secondary" onclick="userModal('${u.id}')">Gerenciar</button> <button class="ghost" onclick="delUser('${u.id}')">🗑</button></div></div>`).join('')+'</div></div>'}
function userModal(id){const u=id?db.users.find(x=>x.id===id):{user:'',role:'unit',unitId:unit?.id||db.units[0]?.id},c=me.role==='central',real=id&&!u.email.endsWith(DOMAIN);
 modal(`<h2>${id?'Gerenciar':'Novo'} usuário</h2><div class="field"><label>Usuário ou e-mail</label><input id="uu" value="${esc(u.user)}" ${id?'disabled':''}></div>${id?'':'<div class="field"><label>Senha inicial (mín. 6)</label><input id="up" type="password"></div>'}${c?`<div class="field"><label>Perfil</label><select id="ur"><option value="unit" ${u.role==='unit'?'selected':''}>Unidade (acessa só a sua)</option><option value="central" ${u.role==='central'?'selected':''}>Central (todas)</option></select></div><div class="field"><label>Unidade</label><select id="ui">${db.units.map(x=>`<option value="${x.id}" ${x.id===u.unitId?'selected':''}>${esc(x.name)}</option>`)}</select></div>`:''}${id?`<p class="hint">${real?`<button class="secondary" onclick="resetPw('${esc(u.email)}')">Enviar e-mail para redefinir a senha</button>`:'Senha deste login: o próprio usuário troca em "Minha senha". Se esqueceu, exclua o acesso e crie outro usuário.'}</p>`:''}<div class="actions"><button class="secondary" onclick="closeM()">Fechar</button><button class="primary" onclick="saveUser('${id||''}')">Salvar</button></div>`)}
async function saveUser(id){try{const c=me.role==='central',role=c?$('ur').value:'unit',unitId=role==='unit'?(c?$('ui').value:me.unitId):null;
 if(id){await fdb.doc('users/'+id).update({role,unitId})}else{const name=$('uu').value.trim(),p=$('up').value;if(!name||p.length<6)return toast('Informe usuário e senha (mínimo 6 caracteres).');if(role==='unit'&&!unitId)return toast('Escolha a unidade.');const em=email(name),uid2=await mkAccount(em,p);await fdb.doc('users/'+uid2).set({role,unitId,email:em})}
 if(unit)log('Salvou o usuário '+(id?shown(db.users.find(x=>x.id===id).email):$('uu').value.trim()));closeM();toast('Usuário salvo.')}catch(e){toast(errMsg(e))}}
async function delUser(id){const u=db.users.find(x=>x.id===id);if(u.id===me.id)return toast('Você não pode excluir o próprio acesso.');if(u.role==='central'&&db.users.filter(x=>x.role==='central').length<2)return toast('Mantenha ao menos um login central.');if(!confirm('Excluir o acesso de "'+u.user+'"? Ele não conseguirá mais entrar.'))return;try{await fdb.doc('users/'+id).delete();toast('Acesso excluído.')}catch(e){toast(errMsg(e))}}
async function resetPw(em){try{await auth.sendPasswordResetEmail(em);toast('E-mail de redefinição enviado.')}catch(e){toast(errMsg(e))}}
function pwModal(){modal('<h2>Minha senha</h2><div class="field"><label>Senha atual</label><input id="pw0" type="password"></div><div class="field"><label>Nova senha (mín. 6)</label><input id="pw1" type="password"></div><div class="actions"><button class="secondary" onclick="closeM()">Cancelar</button><button class="primary" onclick="chPw()">Alterar</button></div>')}
async function chPw(){try{const u=auth.currentUser,n=$('pw1').value;if(n.length<6)return toast('Mínimo 6 caracteres.');await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,$('pw0').value));await u.updatePassword(n);closeM();toast('Senha alterada.')}catch(e){toast(errMsg(e))}}
/* ===== central: unidades ===== */
function vUnits(){const on=online();return topb('Unidades','<button class="secondary" onclick="exportAll()">⬇ Backup geral</button><button class="secondary" onclick="importBkp()">⬆ Restaurar</button><button class="secondary" onclick="logoModal()">Logotipo</button><button class="primary" onclick="unitModal()">+ Nova unidade</button>')+'<div class="page"><p class="sub">Atualização automática. Unidade ativa = com login conectado nos últimos minutos.</p><div class="grid">'+db.units.map(u=>{const us=[...new Set(on.filter(x=>x.unit===u.id).map(x=>x.u))];return`<div class="card" onclick="openUnit('${u.id}')"><h3>${esc(u.name)}<span class="pill ${us.length?'ok':'off'}">${us.length?'● ATIVA':'inativa'}</span></h3><div class="meta">${u.nS??(u.sectors||[]).length} setores · ${u.nE??(u.sectors||[]).reduce((a,s)=>a+(s.employees||[]).length,0)} funcionários</div><div class="meta">${us.length?'Online: '+esc(us.join(', ')):'Ninguém conectado'}</div><div style="margin-top:8px"><button class="ghost" onclick="event.stopPropagation();renUnit('${u.id}')">Renomear</button><button class="ghost" onclick="event.stopPropagation();delUnit('${u.id}')">Excluir</button></div></div>`}).join('')+'</div></div>'}
async function openUnit(id){toast('Carregando unidade…');await settle();await loadUnit(id);beat();go('home')}
function unitModal(){modal(`<h2>Nova unidade</h2><div class="field"><label>Nome da unidade</label><input id="nn"></div><div class="field"><label>Login da unidade (usuário ou e-mail)</label><input id="nu"></div><div class="field"><label>Senha (mín. 6)</label><input id="np" type="password"></div><div class="actions"><button class="secondary" onclick="closeM()">Cancelar</button><button class="primary" onclick="mkUnit()">Criar</button></div>`)}
async function mkUnit(){const n=$('nn').value.trim(),u=$('nu').value.trim(),p=$('np').value;if(!n||!u||p.length<6)return toast('Preencha tudo (senha com no mínimo 6 caracteres).');try{const id=nid('u'),em=email(u),uid2=await mkAccount(em,p);await fdb.doc('units/'+id).set({name:n,nS:0,nE:0,migrated:true});await fdb.doc('users/'+uid2).set({role:'unit',unitId:id,email:em});closeM();toast('Unidade criada.')}catch(e){toast(errMsg(e))}}
async function renUnit(id){const u=db.units.find(x=>x.id===id),n=prompt('Novo nome da unidade:',u.name);if(n&&n.trim())try{await fdb.doc('units/'+id).update({name:n.trim()})}catch(e){toast(errMsg(e))}}
async function delUnit(id){const u=db.units.find(x=>x.id===id);if(!confirm(`ATENÇÃO: excluir a unidade "${u.name}" apaga setores, funcionários, escalas e acessos dela. IRREVERSÍVEL.`))return;try{
 if(unit&&unit.id===id){unsubUnit();unit=sector=null;view='units'}
 for(const c of [...COLS,'history']){const sn=await fdb.collection('units/'+id+'/'+c).get();for(let i=0;i<sn.docs.length;i+=400){const b=fdb.batch();sn.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
 const b=fdb.batch();b.delete(fdb.doc('units/'+id));db.users.filter(x=>x.unitId===id).forEach(x=>b.delete(fdb.doc('users/'+x.id)));await b.commit();toast('Unidade excluída.')}catch(e){toast(errMsg(e))}}
function logoModal(){modal(`<h2>Logotipo do Posto 7</h2><div class="field"><input id="lf" type="file" accept="image/*"><div class="hint">Aparece no menu, no login e na impressão.</div></div><div class="actions">${db.logo?'<button class="danger" style="margin-right:auto" onclick="setLogo(null)">Remover</button>':''}<button class="secondary" onclick="closeM()">Cancelar</button></div>`);$('lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,420/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let d=c.toDataURL('image/png');if(d.length>700000)d=c.toDataURL('image/jpeg',.85);setLogo(d)};im.src=r.result};r.readAsDataURL(f)}}
async function setLogo(d){try{await fdb.doc('meta/config').set({logo:d});closeM()}catch(e){toast(errMsg(e))}}
/* ===== backup / restauração ===== */
function dl(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download=name;a.click()}
function exportBkp(){dl('posto7-'+unit.name.replace(/\W+/g,'_')+'-'+dk(new Date())+'.json',{posto7:1,unit:clean(unit)})}
async function exportAll(){try{toast('Gerando backup de todas as unidades…');const all=[];for(const m of db.units)all.push(clean(await fetchUnit(m.id)));dl('posto7-geral-'+dk(new Date())+'.json',{posto7:1,units:all})}catch(e){toast(errMsg(e))}}
function importBkp(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);if(!o.posto7)throw Error('Arquivo de backup inválido.');
 if(o.unit&&unit){if(!confirm('Substituir TODOS os dados da unidade "'+unit.name+'" pelo backup? Irreversível.'))return;unit.sectors=(o.unit.sectors||[]).map(s=>({...s,employees:s.employees||[],scales:s.scales||{}}));unit.vacations=o.unit.vacations||[];log('Restaurou backup');await settle();toast('Backup restaurado.');render()}
 else if(o.units&&me.role==='central'&&!unit){if(!confirm('Adicionar '+o.units.length+' unidade(s) do backup? (os logins não são restaurados)'))return;for(const u of o.units)await writeFull(nid('u'),u,u.name||'Unidade restaurada');toast('Unidades importadas.')}
 else throw Error('Este backup não serve para esta tela.')}catch(e){toast(e.message)}};r.readAsText(i.files[0])};i.click()}
/* ===== inicialização ===== */
(async()=>{$('loginLogo').innerHTML=logoHTML(60);if(!fbInit())return;
 try{const[lg,su]=await Promise.all([fdb.doc('meta/config').get(),fdb.doc('meta/setup').get()]);if(lg.exists)db.logo=lg.data().logo||null;$('loginLogo').innerHTML=logoHTML(60);if(!su.exists){$('lsetup').style.display='block';$('lmsg').textContent='Nenhum administrador criado ainda: preencha usuário e senha e clique em "Primeiro acesso".'}}
 catch(e){console.error(e);$('lmsg').textContent='Não foi possível conectar ao banco. Confira a configuração e as regras do Firestore.'}
 auth.onAuthStateChanged(u=>{if(u&&!hold&&!me)enter(u)})})();
</script></body></html>
